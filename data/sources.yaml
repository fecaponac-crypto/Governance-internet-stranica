# Data Governance Signal — source catalog
#
# Used by the ingestion pipeline (phase 3). See docs/katalog-izvora.md for the overview.
#
# Fields:
#   id           unique slug
#   name         display name
#   url          homepage / listing page
#   feeds        verified RSS/Atom feeds (method: rss)
#   method       rss | scrape | manual
#   type         regulator | standards | association | ngo | expert-media | law-firm-blog | media | analyst | vendor
#   section      core (Data Governance) | broad (Data & AI)
#   categories   see docs/specifikacija.md, section 4
#   reliability  3 = primary/official, 2 = expert secondary or vendor, 1 = general media
#   priority     high | medium | low
#   filter       true = noisy feed, keep only items matching `keywords` before AI scoring
#   scrape       (method: scrape) link_pattern = regex for article URLs on the listing page,
#                exclude = optional regex for URLs to skip (e.g. sponsored content)
#   active       false = kept for reference, not fetched
#   verified     date the feed/page was last checked

verified_on: 2026-10-25

# Pre-filter for sources marked `filter: true` (case-insensitive, matched on title + summary).
keywords:
  - data governance
  - data quality
  - data catalog
  - metadata
  - lineage
  - master data
  - data steward
  - data management
  - data protection
  - privacy
  - personal data
  - GDPR
  - AI Act
  - Data Act
  - Data Governance Act
  - DORA
  - NIS2
  - artificial intelligence
  - AI governance
  - responsible AI
  - data sharing
  - data space
  - cloud
  - fine
  - Unity Catalog
  - Horizon
  - Purview
  - Dataplex
  - DataZone
  - Lake Formation
  - BCBS 239
  - risk data aggregation
  - Digital Omnibus
  - algorithm
  - ePrivacy
  - cybersecurity
  - Cyber Resilience Act

categories:
  core:
    - strategy          # Governance Strategy & Operating Models
    - data-quality      # Data Quality
    - metadata          # Metadata, Catalogs & Lineage
    - privacy           # Privacy & Data Protection
    - regulation        # Regulation & Compliance
    - ai-governance     # AI Governance
    - mdm               # Master & Reference Data
    - security          # Security & Access
    - market            # Vendors & Market
  broad:
    - platforms         # Data Platforms & Architecture
    - analytics         # Analytics & BI
    - ai-industry       # AI Industry

