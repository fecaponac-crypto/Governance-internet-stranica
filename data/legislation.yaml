  jurisdiction: UK
  kind: Act of Parliament
  stage: Applies
  stageDate: 2026-02-05
  stageNote: "Royal Assent on 19 June 2025; brought into force in stages by commencement regulations. The main data protection and e-privacy changes have applied since 5 February 2026, and the Information Commission replaced the Information Commissioner on 30 September 2026."
  summary: "Amends the UK GDPR, the Data Protection Act 2018 and the e-privacy rules (PECR), and sets up smart data schemes and a framework for digital verification services."
  official:
