# Legislation tracker (/legislation/): laws, rules and policy statements we follow from
# proposal to application. Stories link to a file through their `legislation` field.
#
#   id:           unique, lowercase-with-hyphens
#   name:         full name as used in the sources
#   short:        short name for lists
#   jurisdiction: EU, UK, US, or a state/country
#   kind:         Regulation, Act, Bill, Rules, Policy statement …
#   stage:        Proposal | Negotiation | Adopted | In force | Applies | Withdrawn | Struck down
#                 (Negotiation = consultation, Council/Parliament positions, trilogue, rulemaking)
#   stageDate:    date the current stage was reached (YYYY-MM-DD), if known
#   stageNote:    one line on where things stand, from our sources
#   summary:      one or two sentences on what it does, from our sources
#   official:     {title, url} — the official text or announcement, when we have it
#
# The stage is confirmed by the editor: a draft that suggests a new stage changes this file
# in the same pull request.
- id: eu-ai-act
  name: EU Artificial Intelligence Act
  short: AI Act
  jurisdiction: EU
  kind: Regulation
  stage: Applies
  stageNote: "Obligations apply in phases; the AI Office's enforcement powers for general-purpose AI models apply since 2 August 2026."
  summary: "EU-wide rules for AI systems by risk level and for general-purpose AI models, enforced by national authorities and, for general-purpose models, by the European Commission's AI Office."
- id: colorado-admt-act
  name: Colorado Automated Decision-Making Technology Act (SB 26-189)
  short: Colorado ADMT Act
  jurisdiction: Colorado, US
  kind: Act
  stage: Adopted
  stageNote: "Takes effect on 1 January 2027; the Department of Law's implementing rules were still in draft (interim draft of 6 October 2026)."
  summary: "Replaced the Colorado AI Act; sets duties for developers and deployers of automated decision-making technology used in consequential decisions."
- id: california-ai-transparency-laws
  name: California AI transparency laws (SB 53 and AB 2013)
  short: California SB 53 and AB 2013
  jurisdiction: California, US
  kind: Acts
  stage: In force
  stageDate: 2026-01-01
  stageNote: "Both took effect on 1 January 2026."
  summary: "SB 53 (Transparency in Frontier Artificial Intelligence Act) covers large frontier developers; AB 2013 (Training Data Transparency Act) requires training-data disclosures from developers of public generative AI, including after fine-tuning."
  official:
    title: "Governor Newsom signs SB 53"
    url: https://www.gov.ca.gov/2025/09/29/governor-newsom-signs-sb-53-advancing-californias-world-leading-artificial-intelligence-industry/
- id: new-york-youth-chatbot-law
  name: New York youth chatbot safety law (S9051B/A10379C)
  short: New York youth chatbot law
  jurisdiction: New York, US
  kind: Act
  stage: Adopted
  stageDate: 2026-10-28
  stageNote: "Signed on 28 October 2026; applies from 1 January 2027."
  summary: "Bars chatbot features in 12 unsafe categories for minors, requires several age assurance methods and the deletion of age data after verification."
- id: eu-kids-act
  name: EU Kids Act (proposed regulation)
  short: EU Kids Act
  jurisdiction: EU
  kind: Regulation
  stage: Proposal
  stageNote: "A proposal under discussion; national authorities and parliaments are giving their views."
  summary: "Proposed EU rules on minors online, including age verification for social media, parental controls and measures against addictive design and profiling."
- id: ftc-personalised-pricing-statement
  name: FTC enforcement policy statement on personalised pricing
  short: FTC personalised pricing statement
  jurisdiction: US
  kind: Policy statement
  stage: Negotiation
  stageNote: "Draft published for comment in August 2026; comment period closed with more than 4,500 comments; not final."
  summary: "Draft statement that undisclosed use of personal data to set individual prices could be an unfair or deceptive practice under the FTC Act."
  official:
    title: "FTC seeks comment on enforcement policy statement regarding personalized pricing"
    url: https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-seeks-comment-enforcement-policy-statement-regarding-personalized-pricing
- id: eu-cloud-ai-development-act
  name: EU Cloud and AI Development Act (proposed regulation)
  short: Cloud and AI Development Act
  jurisdiction: EU
  kind: Regulation
  stage: Proposal
  stageDate: 2026-06-03
  stageNote: "Commission proposal COM(2026) 502 under discussion; cloud providers and industry groups are contesting the scope of the sovereignty levels."
  summary: "Aims to speed up data centre and cloud capacity in the EU and sets an EU-wide cloud and AI sovereignty framework with four assurance levels, which public sector bodies would use based on their risk assessments."
  official:
    title: "European Commission: Cloud and AI Development Act"
    url: https://digital-strategy.ec.europa.eu/en/policies/cloud-and-ai-development-act
- id: pennsylvania-ai-deceptive-advertising-act
  name: Pennsylvania Artificial Intelligence Deceptive Advertising Act (SB 806, Act 99 of 2026)
  short: Pennsylvania AI Advertising Act
  jurisdiction: Pennsylvania, US
  kind: Act
  stage: Adopted
  stageDate: 2026-10-22
  stageNote: "Signed on 22 October 2026; takes effect on 21 December 2026, 60 days after signature."
  summary: "Requires a clear and conspicuous AI disclosure on adverts that use AI-generated or AI-modified content in a way that creates a false impression about goods or services; enforced by the Attorney General or district attorneys, with civil fines of up to $3,000."
  official:
    title: "Pennsylvania General Assembly: Senate Bill 806 (2025-2026)"
    url: https://www.palegis.us/legislation/bills/2025/sb806
- id: chile-data-protection-law-21719
  name: Chile Law 21.719 on personal data protection (amending Law 19.628)
  short: Chile Law 21.719
  jurisdiction: Chile
  kind: Act
  stage: Adopted
  stageDate: 2024-12-13
  stageNote: "Published on 13 December 2024 and due to apply from 1 December 2026; a bill to postpone this to 15 October 2027 (Boletín 18.623-07) has passed the Senate and is before the Chamber of Deputies."
  summary: "Overhauls Chile's data protection framework and creates a Personal Data Protection Agency; a pending bill would move its start date and the appointment of the agency's board."
- id: eu-digital-fairness-act
  name: EU Digital Fairness Act (proposed regulation, COM(2026) 1100)
  short: Digital Fairness Act
  jurisdiction: EU
  kind: Regulation
  stage: Proposal
  stageDate: 2026-11-11
  stageNote: "Commission proposal of 11 November 2026; Parliament and Council have yet to negotiate the text."
  summary: "Would replace the Unfair Commercial Practices Directive with a directly applicable regulation, banning business-to-consumer dark patterns and personalised ads to minors or based on sensitive data, and limiting harmful personalised pricing."
  official:
    title: "European Commission: Proposal for a Digital Fairness Act, COM(2026) 1100"
    url: https://commission.europa.eu/document/download/0575d59f-554f-4a9e-b54b-e6b717175809_en
- id: eu-gdpr
  name: General Data Protection Regulation (Regulation (EU) 2016/679)
  short: GDPR
  jurisdiction: EU
  kind: Regulation
  stage: Applies
  stageDate: 2018-05-25
  stageNote: "Applies since 25 May 2018. The Digital Omnibus, now in negotiation, would amend parts of it."
  summary: "The EU's general rules on processing personal data: lawful bases, individuals' rights, controller and processor duties, transfers and enforcement by national data protection authorities."
  official:
    title: "EUR-Lex: Regulation (EU) 2016/679"
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
- id: eu-data-act
  name: Data Act (Regulation (EU) 2023/2854)
  short: Data Act
  jurisdiction: EU
  kind: Regulation
  stage: Applies
  stageDate: 2025-09-12
  stageNote: "Applies since 12 September 2025, with later dates for connected-product design and for older contracts."
  summary: "Harmonised rules on fair access to and use of data, including data from connected products and related services, data sharing between businesses, switching between data processing services and unfair contract terms."
  official:
    title: "EUR-Lex: Regulation (EU) 2023/2854"
    url: https://eur-lex.europa.eu/eli/reg/2023/2854/oj
  dates:
    - date: 2025-09-12
      what: "Data Act starts to apply"
    - date: 2026-09-12
      what: "Data Act: the access-by-design obligation in Article 3(1) applies to connected products and related services placed on the market after this date"
    - date: 2027-09-12
      what: "Data Act: Chapter IV on unfair contract terms starts to apply to certain contracts concluded on or before 12 September 2025"
- id: eu-data-governance-act
  name: Data Governance Act (Regulation (EU) 2022/868)
  short: Data Governance Act
  jurisdiction: EU
  kind: Regulation
  stage: Applies
  stageDate: 2023-09-24
  stageNote: "Applies since 24 September 2023. The Council's Digital Omnibus mandate would repeal it and move its rules elsewhere."
  summary: "Rules for the re-use of protected public-sector data, data intermediation services and data altruism organisations, and the European Data Innovation Board."
  official:
    title: "EUR-Lex: Regulation (EU) 2022/868"
    url: https://eur-lex.europa.eu/eli/reg/2022/868/oj
- id: eu-digital-services-act
  name: Digital Services Act (Regulation (EU) 2022/2065)
  short: Digital Services Act
  jurisdiction: EU
  kind: Regulation
  stage: Applies
  stageDate: 2024-02-17
  stageNote: "Applies in full since 17 February 2024; the Commission enforces it against very large online platforms and search engines."
  summary: "Rules for online intermediaries and platforms on illegal content, transparency, recommender systems, advertising and the protection of minors, with risk-assessment duties for very large platforms."
  official:
    title: "EUR-Lex: Regulation (EU) 2022/2065"
    url: https://eur-lex.europa.eu/eli/reg/2022/2065/oj
- id: eu-digital-markets-act
  name: Digital Markets Act (Regulation (EU) 2022/1925)
  short: Digital Markets Act
  jurisdiction: EU
  kind: Regulation
  stage: Applies
  stageDate: 2023-05-02
  stageNote: "Applies since 2 May 2023."
  summary: "Obligations for designated gatekeeper platforms, including limits on combining personal data across services, data portability and access to data for business users."
  official:
    title: "EUR-Lex: Regulation (EU) 2022/1925"
    url: https://eur-lex.europa.eu/eli/reg/2022/1925/oj
- id: eu-dora
  name: Digital Operational Resilience Act (Regulation (EU) 2022/2554)
  short: DORA
  jurisdiction: EU
  kind: Regulation
  stage: Applies
  stageDate: 2025-01-17
  stageNote: "Applies since 17 January 2025."
  summary: "Digital operational resilience rules for the financial sector: ICT risk management, incident reporting, resilience testing and the management of ICT third-party risk."
  official:
    title: "EUR-Lex: Regulation (EU) 2022/2554"
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
- id: eu-nis2
  name: NIS 2 Directive (Directive (EU) 2022/2555)
  short: NIS 2
  jurisdiction: EU
  kind: Directive
  stage: Applies
  stageDate: 2024-10-18
  stageNote: "Member States had to transpose it by 17 October 2024 and apply their measures from 18 October 2024; obligations bind organisations through national law."
  summary: "Cybersecurity risk-management and incident-reporting duties for essential and important entities across the EU, replacing the first NIS Directive."
  official:
    title: "EUR-Lex: Directive (EU) 2022/2555"
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- id: eu-cyber-resilience-act
  name: Cyber Resilience Act (Regulation (EU) 2024/2847)
  short: Cyber Resilience Act
  jurisdiction: EU
  kind: Regulation
  stage: In force
  stageNote: "In force; reporting obligations apply since 11 September 2026 and the regulation applies in full from 11 December 2027."
  summary: "Horizontal cybersecurity requirements for products with digital elements, covering design, vulnerability handling and reporting by manufacturers."
  official:
    title: "EUR-Lex: Regulation (EU) 2024/2847"
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  dates:
    - date: 2026-06-11
      what: "Cyber Resilience Act: Chapter IV on the notification of conformity assessment bodies starts to apply"
    - date: 2026-09-11
      what: "Cyber Resilience Act: manufacturers' reporting obligations under Article 14 start to apply"
    - date: 2027-12-11
      what: "Cyber Resilience Act starts to apply in full"
- id: eu-health-data-space
  name: European Health Data Space Regulation (Regulation (EU) 2025/327)
  short: European Health Data Space
  jurisdiction: EU
  kind: Regulation
  stage: In force
  stageNote: "In force; applies from 26 March 2027, with later dates for the priority categories of electronic health data."
  summary: "Rules on individuals' access to and control over their electronic health data, electronic health record systems and the secondary use of health data."
  official:
    title: "EUR-Lex: Regulation (EU) 2025/327"
    url: https://eur-lex.europa.eu/eli/reg/2025/327/oj
  dates:
    - date: 2027-03-26
      what: "European Health Data Space Regulation starts to apply"
    - date: 2029-03-26
      what: "European Health Data Space: rules start to apply to the first priority categories of electronic health data (Article 14(1)(a) to (c))"
    - date: 2031-03-26
      what: "European Health Data Space: rules start to apply to the further priority categories of electronic health data (Article 14(1)(d) to (f))"
- id: eu-product-liability-directive
  name: Product Liability Directive (Directive (EU) 2024/2853)
  short: Product Liability Directive
  jurisdiction: EU
  kind: Directive
  stage: In force
  stageNote: "In force; Member States must bring their national measures into force by 9 December 2026."
  summary: "Liability for defective products, replacing Directive 85/374/EEC."
  official:
    title: "EUR-Lex: Directive (EU) 2024/2853"
    url: https://eur-lex.europa.eu/eli/dir/2024/2853/oj
  dates:
    - date: 2026-12-09
      what: "Product Liability Directive: deadline for Member States to bring national measures into force"
