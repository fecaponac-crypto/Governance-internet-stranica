      what: "UK Data (Use and Access) Act: most of Part 2 (digital verification services) comes into force"
    - date: 2026-02-05
      what: "UK Data (Use and Access) Act: main data protection changes come into force, including lawfulness of processing, automated decision-making, international transfers and the regulator's new enforcement powers"
    - date: 2026-06-19
      what: "UK Data (Use and Access) Act: section 103 (complaints by data subjects to the controller) comes into force"
    - date: 2026-09-30
