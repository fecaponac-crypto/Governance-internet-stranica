name: Prepare The Monday Signal

on:
  schedule:
    # Mondays 05:47 UTC. The Cloudflare Worker cron dispatches the same run, because GitHub
    # can delay or skip scheduled runs; the second run finds the package and does nothing.
    - cron: '47 5 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: 'Column date (a Monday, YYYY-MM-DD); default today'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monday
  cancel-in-progress: false

jobs:
  monday:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Test
        working-directory: pipeline
        run: python -m unittest -v

      - name: Configure git
        run: |
          git config user.name "dgs-ingest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Open the column package
        run: python pipeline/monday.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit AI usage
        run: |
          git add data/state/ai.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Monday Signal: record AI usage [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
