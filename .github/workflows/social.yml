name: Post new stories to Bluesky and Mastodon

on:
  push:
    branches: [claude/data-intelligence-portal-plan-v46ux0]
    paths: ['src/content/**']
  schedule:
    - cron: '41 7 * * *' # scheduled Opinion essays go live with the morning build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
    steps:
      # The newest commit of the branch, not the one that triggered the run: it holds the
      # latest record of what was posted, so a story is never posted twice.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Post new stories
        id: post
        run: |
          python pipeline/social.py | tee social.log
          tail -n 1 social.log > summary.json

      - name: Save what was posted
        run: |
          git config user.name "dgs-social-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/state/social.json "$RUNNER_TEMP/ours.json"
          for i in 1 2 3; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard "origin/${GITHUB_REF_NAME}"
            git show "origin/${GITHUB_REF_NAME}:data/state/social.json" > "$RUNNER_TEMP/theirs.json"
            python pipeline/merge_social_state.py "$RUNNER_TEMP/ours.json" "$RUNNER_TEMP/theirs.json" data/state/social.json
            git add data/state/social.json
            if git diff --cached --quiet; then exit 0; fi
            git commit --quiet -m "Social: record posted stories [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      # A red run makes GitHub notify the owner, e.g. when an app password stops working.
      - name: Alert when posting failed
        run: |
          python -c "import json,sys; s=json.load(open('summary.json')); sys.exit(1 if s.get('failed') else 0)"
