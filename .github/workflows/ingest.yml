name: Ingest sources and draft articles

on:
  schedule:
    # Every 3 hours at :17 (UTC). GitHub can delay or skip scheduled runs under load,
    # so a frequent schedule keeps a missed run from leaving long gaps.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      max_drafts:
        description: 'Maximum number of drafts to open in this run'
        default: '6'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      # Optional, for the monthly figures in data/metrics (skipped when unset).
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
      FEEDBACK_READ_TOKEN: ${{ secrets.FEEDBACK_READ_TOKEN }}
      MAX_DRAFTS_PER_RUN: ${{ inputs.max_drafts || '6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Test
        working-directory: pipeline
        run: python -m unittest -v

      - name: Configure git
        run: |
          git config user.name "dgs-ingest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect new items
        run: python pipeline/ingest.py

      - name: Draft articles for review
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python pipeline/draft.py

      - name: Update this month's figures
        run: python pipeline/metrics.py > /dev/null

      - name: Commit results
        run: |
          git add data/archive data/state data/reports data/metrics
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          new=$(tail -n 1 data/state/runs.jsonl | python -c "import json,sys; print(json.load(sys.stdin)['new'])")
          # [skip ci] keeps Cloudflare from rebuilding the site for data-only commits, except for
          # the first run of the day (06 UTC), which rebuilds it so the homepage lead and the
          # key dates reflect the new day even when nothing was published.
          skip=" [skip ci]"
          if [ "$(date -u +%H)" = "06" ]; then skip=""; fi
          git commit -m "Ingest: ${new} new items${skip}"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
